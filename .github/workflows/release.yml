name: Build and Release EXE

on:
  push:
    tags:
      - 'v*' # Dispara quando uma tag começando com 'v' é enviada

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter Pillow mutagen tinytag pyinstaller shazamio httpx imageio-ffmpeg anyio

      - name: Build EXE with PyInstaller
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Compila incluindo o binário na raiz do executável
          # imageio-ffmpeg já inclui o binário, então não precisamos de --add-binary separado para ele.
          # PyInstaller deve coletar o imageio-ffmpeg e seus dados automaticamente.
          python -m PyInstaller --noconfirm --onefile --windowed --add-data "images;images" --collect-all shazamio --collect-all httpx --collect-all anyio --collect-all imageio_ffmpeg --icon "images/sync_icon.ico" --name "SyncDJ_Tools_$env:REF_NAME" main.py

      - name: List dist folder
        run: dir dist
      
      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/SyncDJ_Tools_${{ github.ref_name }}.exe
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false          
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true