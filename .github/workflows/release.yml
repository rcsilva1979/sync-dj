name: Build and Release EXE

on:
  push:
    tags:
      - 'v*' # Dispara quando uma tag começando com 'v' é enviada

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter Pillow mutagen tinytag pyinstaller shazamio httpx static-ffmpeg anyio

      - name: Build EXE with PyInstaller
        run: |
          # Força o download do binário do FFmpeg no ambiente de build
          python -m static_ffmpeg.run --version
          # Localiza o caminho real do binário instalado
          $FFMPEG_EXE = python -c "import static_ffmpeg; static_ffmpeg.add_paths(); import shutil; import os; print(os.path.abspath(shutil.which('ffmpeg')))"
          echo "FFmpeg localizado em: $FFMPEG_EXE"
          # Compila incluindo o binário na raiz do executável
          python -m PyInstaller --noconfirm --onefile --windowed --add-data "images;images" --add-binary "$FFMPEG_EXE;." --collect-all shazamio --collect-all httpx --collect-all anyio --icon "images/sync_icon.ico" --name "SyncDJ_Tools_${{ github.ref_name }}" main.py

      - name: List dist folder
        run: dir dist
      
      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SyncDJ_Tools_${{ github.ref_name }}.exe
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false          
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true